  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #fdf8f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    color: #3a2c1e;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: normal;
    letter-spacing: 0.06em;
    color: #6b4c2a;
  }

  header p {
    margin-top: 8px;
    font-size: 0.95rem;
    color: #8a6d50;
    font-style: italic;
  }

  .search-wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
    margin-bottom: 32px;
  }

  #search {
    width: 100%;
    padding: 14px 20px;
    font-size: 1.05rem;
    font-family: inherit;
    border: 1.5px solid #c9a97a;
    border-radius: 40px;
    background: #fff;
    color: #3a2c1e;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #search:focus {
    border-color: #9b6f3b;
    box-shadow: 0 0 0 3px rgba(155, 111, 59, 0.15);
  }

  #search::placeholder { color: #b89e82; }

  #result {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .card {
    background: #fff;
    border: 1px solid #e2cdb0;
    border-radius: 16px;
    padding: 32px 28px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(100,70,30,0.07);
  }

  .card .guest-name {
    font-size: 1.25rem;
    font-weight: bold;
    color: #6b4c2a;
    margin-bottom: 8px;
  }

  .card .table-label {
    font-size: 2.2rem;
    font-weight: bold;
    color: #9b6f3b;
    margin: 8px 0 16px;
    letter-spacing: 0.04em;
  }

  .card .also-seated {
    font-size: 0.82rem;
    color: #9a8068;
    font-style: italic;
    line-height: 1.6;
  }

  .divider {
    border: none;
    border-top: 1px solid #e2cdb0;
    margin: 14px 0;
  }

  .multi-hint {
    font-size: 0.85rem;
    color: #9a8068;
    margin-bottom: 10px;
    font-style: italic;
  }

  .no-result {
    color: #9a8068;
    font-style: italic;
    padding: 20px 0;
  }

const searchEl = document.getElementById('search');
const resultEl = document.getElementById('result');

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
}

function score(name, query) {
  const n = normalize(name);
  const q = normalize(query);
  if (n === q) return 100;
  if (n.startsWith(q)) return 80;
  if (n.includes(q)) return 60;
  const queryWords = q.split(' ');
  const nameWords = n.split(' ');
  const allMatch = queryWords.every(qw => nameWords.some(nw => nw.startsWith(qw)));
  if (allMatch) return 70;
  const anyMatch = queryWords.some(qw => nameWords.some(nw => nw.startsWith(qw)));
  if (anyMatch) return 40;
  return 0;
}

function render(query) {
  const q = query.trim();
  if (q.length < 2) { resultEl.innerHTML = ''; return; }

  const hits = Object.entries(GUESTS)
    .map(([name, table]) => ({ name, table, s: score(name, q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, 5);

  if (!hits.length) {
    resultEl.innerHTML = '<p class="no-result">No guest found &mdash; try a different spelling.</p>';
    return;
  }

  if (hits.length > 1) {
    resultEl.innerHTML = '<p class="multi-hint">Multiple matches &mdash; keep typing to narrow down.</p>' +
      hits.map(h => cardHTML(h.name, h.table, false)).join('');
  } else {
    resultEl.innerHTML = cardHTML(hits[0].name, hits[0].table, true);
  }
}

function cardHTML(name, tableNum, showTablemates) {
  const tablemates = (TABLES[tableNum] || []).filter(n => n !== name);
  const tablemateStr = showTablemates && tablemates.length
    ? '<hr class="divider"><div class="also-seated">Also at your table:<br>' + tablemates.join(' &bull; ') + '</div>'
    : '';
  return `<div class="card">
    <div class="guest-name">${name}</div>
    <div class="table-label">Table ${tableNum}</div>
    ${tablemateStr}
  </div>`;
}

searchEl.addEventListener('input', () => render(searchEl.value));
